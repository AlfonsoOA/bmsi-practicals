name: Build and test the practicals image

# Builds the image students' codespaces use, publishes it to GHCR, then runs
# every R practical inside it on a machine the size of a codespace (2 CPU,
# 8 GB RAM) and reports time and peak memory in the run summary.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".devcontainer/build/**", "scripts/**", "data/**", "tests/**", ".github/workflows/build-image.yml"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bmsi-practicals
  TAG: "2026-27"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case image name
        run: echo "IMAGE=${IMAGE,,}" >> $GITHUB_ENV
      - name: Build the base image (log tail reported as an annotation if it fails)
        run: |
          set -o pipefail
          if ! docker build --progress=plain -t bmsi-base .devcontainer/build 2>&1 | tee build.log; then
            msg=$(tail -n 80 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Image build failed::$msg"
            exit 1
          fi
      - name: Build and push (Dockerfile + RStudio Server feature)
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/build/devcontainer.json
          imageName: ${{ env.IMAGE }}
          imageTag: ${{ env.TAG }}
          push: always

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case image name
        run: echo "IMAGE=${IMAGE,,}" >> $GITHUB_ENV
      - name: Pull image
        run: |
          docker pull $IMAGE:$TAG
          echo "### Image" >> $GITHUB_STEP_SUMMARY
          SIZE=$(docker image inspect $IMAGE:$TAG --format '{{.Size}}' | awk '{printf "%.1f GB", $1/1e9}')
          echo "Size: $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Image size::$SIZE (uncompressed)"
          docker history --no-trunc --format '{{.Size}}  {{.CreatedBy}}' $IMAGE:$TAG | awk '$1 ~ /GB|MB/' | cut -c1-120 > layers.txt
          echo "::notice title=Large layers::$(sed 's/%/%25/g' layers.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Run the practicals at codespace size (2 CPU, 8 GB)
        run: |
          docker run --rm --cpus 2 --memory 8g --memory-swap 8g -e HOME=/root \
            -v "$PWD":/repo -w /repo $IMAGE:$TAG bash tests/run_practicals.sh | tee test.log
          echo "### Practicals (2 CPU, 8 GB)" >> $GITHUB_STEP_SUMMARY
          grep '^|' test.log >> $GITHUB_STEP_SUMMARY
          # The same table as an annotation (readable through the API), and fail if anything failed
          echo "::notice title=Practicals test::$(grep '^|' test.log | sed ':a;N;$!ba;s/\n/%0A/g')"
          for f in test_logs/*.log; do
            if grep -qE "^Error|Execution halted" "$f"; then
              echo "::error title=$(basename $f)::$(tail -n 25 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            fi
          done
          # Which long steps PC3 ran or took from its caches
          echo "::notice title=PC3 long steps::$(grep -inE 'fitting|bayesian|cache|reus|MSstats input|setting|minutes|compil' test_logs/PC3_Proteomics.log | head -n 40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          ! grep -qE 'FAILED|MISSING' test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: test_logs/
