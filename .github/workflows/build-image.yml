name: Build and test the practicals image

# Builds the image students' codespaces use, publishes it to GHCR, then runs
# every R practical inside it on a machine the size of a codespace (2 CPU,
# 8 GB RAM) and reports time and peak memory in the run summary.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".devcontainer/build/**", "scripts/**", "data/**", "tests/**", ".github/workflows/build-image.yml"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bmsi-practicals
  TAG: "2026-27"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case image name
        run: echo "IMAGE=${IMAGE,,}" >> $GITHUB_ENV
      - name: Build and push (Dockerfile + RStudio Server feature)
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/build/devcontainer.json
          imageName: ${{ env.IMAGE }}
          imageTag: ${{ env.TAG }}
          push: always

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case image name
        run: echo "IMAGE=${IMAGE,,}" >> $GITHUB_ENV
      - name: Pull image
        run: |
          docker pull $IMAGE:$TAG
          echo "### Image" >> $GITHUB_STEP_SUMMARY
          echo "Size: $(docker image inspect $IMAGE:$TAG --format '{{.Size}}' | awk '{printf "%.1f GB", $1/1e9}')" >> $GITHUB_STEP_SUMMARY
      - name: Run the practicals at codespace size (2 CPU, 8 GB)
        run: |
          docker run --rm --cpus 2 --memory 8g --memory-swap 8g -e HOME=/root \
            -v "$PWD":/repo -w /repo $IMAGE:$TAG bash tests/run_practicals.sh | tee test.log
          echo "### Practicals (2 CPU, 8 GB)" >> $GITHUB_STEP_SUMMARY
          grep '^|' test.log >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: test_logs/
